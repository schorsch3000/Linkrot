name: Image

# Builds the container image (Dockerfile) for linux/amd64 and linux/arm64 and pushes it to ghcr.io/<owner>/linkrot.
# Called by CI for every push to main (tag edge) and by the release workflow for a version tag (1.2.3, 1.2, 1 and
# latest; a pre-release like 1.2.3-rc1 only gets its own tag). The pushed image gets a signed build provenance
# attestation in the registry: gh attestation verify oci://ghcr.io/schorsch3000/linkrot:<tag> --repo schorsch3000/Linkrot

on:
  workflow_call:
    inputs:
      version:
        description: "edge, or the version of the release (1.2.3)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # to sign the attestation with the identity of this workflow run
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/linkrot"
          tags="$image:$VERSION"
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            tags+=",$image:${BASH_REMATCH[1]}.${BASH_REMATCH[2]},$image:${BASH_REMATCH[1]},$image:latest"
          fi
          {
            echo "image=$image"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "$tags"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: LINKROT_VERSION=${{ inputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed statement that this image was built by this workflow from this commit, stored next to it in the registry.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
