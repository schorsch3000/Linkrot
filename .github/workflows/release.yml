name: Release

# Push a tag like v1.2.3 (or v1.2.3-rc1 for a pre-release) to publish:
#   linkrot-server-<version>.tar.gz   server: htdocs/ + app/ (no vendor/, run composer install on deployment)
#   linkrot-shared-<version>.zip      server for shared hosting: the document root, vendor/ included, setup.php
#   linkrot_<version>_<os>_<arch>     CLI archives for linux, macOS, windows and freebsd
#   SHA256SUMS
#   ghcr.io/<owner>/linkrot:<version> (and :1.2, :1, :latest for a release that is no pre-release), see image.yml
# Every file and the image also get a signed build provenance attestation.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The checks of the CI workflow are not repeated here: ci-passed only requires that they passed for this commit,
  # while the builds run next to it.
  ci-passed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/require-ci.sh
      - id: v
        run: echo "version=$(.github/scripts/release-version.sh)" >> "$GITHUB_OUTPUT"

  server-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: echo "version=$(.github/scripts/release-version.sh)" >> "$GITHUB_OUTPUT"
      # the shared hosting zip has the dependencies inside: composer install needs PHP 8.4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, mbstring, ctype
          tools: composer:v2
          coverage: none
      - run: make -C server dist shared-dist VERSION=${{ steps.v.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-dist
          path: |
            server/build/linkrot-server-*.tar.gz
            server/build/linkrot-shared-*.zip
          if-no-files-found: error

  cli-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: echo "version=$(.github/scripts/release-version.sh)" >> "$GITHUB_OUTPUT"
      # caches modules and the build cache (restored from main, where CI builds all platforms)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: make -C cli dist VERSION=${{ steps.v.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-dist
          path: |
            cli/dist/*.tar.gz
            cli/dist/*.zip
          if-no-files-found: error

  # after the GitHub release, so that an image never exists for a release that failed
  image:
    needs: [ci-passed, release]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.ci-passed.outputs.version }}

  release:
    needs: [ci-passed, server-dist, cli-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # to sign the attestation with the identity of this workflow run
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Signed statement that these exact files were built by this workflow from this commit; checked with
      # `gh attestation verify <file> --repo schorsch3000/Linkrot` (docs/DEPLOYMENT.md).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${flags[@]}"
