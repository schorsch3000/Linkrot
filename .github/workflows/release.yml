name: Release

# Push a tag like v1.2.3 (or v1.2.3-rc1 for a pre-release) to publish:
#   linkrot-server-<version>.tar.gz   server: htdocs/ + app/ (no vendor/, run composer install on deployment)
#   linkrot_<version>_<os>_<arch>     CLI archives for linux, macOS, windows and freebsd
#   SHA256SUMS

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The checks of the CI workflow are not repeated here: ci-passed only requires that they passed for this commit,
  # while the builds run next to it.
  ci-passed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/require-ci.sh

  server-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(.github/scripts/release-version.sh)" >> "$GITHUB_OUTPUT"
      - run: make -C server dist VERSION=${{ steps.v.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/build/linkrot-server-*.tar.gz
          if-no-files-found: error

  cli-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(.github/scripts/release-version.sh)" >> "$GITHUB_OUTPUT"
      # caches modules and the build cache (restored from main, where CI builds all platforms)
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: make -C cli dist VERSION=${{ steps.v.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: |
            cli/dist/*.tar.gz
            cli/dist/*.zip
          if-no-files-found: error

  release:
    needs: [ci-passed, server-dist, cli-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${flags[@]}"
