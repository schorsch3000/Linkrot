name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # also run by the release workflow before anything is published

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (phpstan, rector, php-cs-fixer, phpunit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          extensions: apcu, pdo_sqlite, sqlite3, mbstring, ctype
          ini-values: apc.enable_cli=1
          tools: composer:v2
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer --working-dir=server/app config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('server/app/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: make -C server install
      - run: make -C server precommit

      - name: Known vulnerabilities in the PHP dependencies (fails on any advisory)
        run: make -C server audit

      - name: Release tarball has the expected layout and installs
        run: make -C server dist-test VERSION=ci

      - name: Shared hosting zip has the expected layout and runs without APCu
        run: make -C server shared-test VERSION=ci

      - name: Release tarball and shared hosting zip are reproducible
        run: make -C server repro

  cli:
    name: CLI (vet, golangci-lint, gofumpt, tests, cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Cache lint tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('cli/Makefile') }}

      - run: make -C cli install
      - run: make -C cli precommit

      - name: Known vulnerabilities in the Go dependencies and standard library (fails on any finding)
        run: make -C cli audit

      - name: All release platforms build, and the archives are reproducible
        run: make -C cli repro

  e2e:
    name: End-to-end (CLI against the real server, behind nginx)
    runs-on: ubuntu-latest
    env:
      LINKROT_E2E_REQUIRED: "1" # a missing prerequisite fails instead of skipping
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          extensions: apcu, pdo_sqlite, sqlite3, mbstring, ctype
          ini-values: apc.enable_cli=1
          tools: composer:v2
          coverage: none

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx
          sudo systemctl stop nginx # the tests start their own instance on free ports

      - run: composer --working-dir=server/app install --no-interaction
      # the shared hosting archive, unpacked: TestEndToEndShared sets it up through setup.php and runs it on php -S
      - run: make -C server shared VERSION=ci
      - run: go test ./e2e/ -count=1 -v
        working-directory: cli
        env:
          LINKROT_E2E_SHARED: ${{ github.workspace }}/server/build/shared

  shared:
    name: Shared hosting zip on Apache (mod_php, .htaccess, no APCu), data ${{ matrix.data }} the document root
    runs-on: ubuntu-latest
    strategy:
      matrix:
        data: [outside, inside]
    env:
      LINKROT_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, sqlite3, mbstring, ctype
          tools: composer:v2
          coverage: none

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - run: make -C server shared VERSION=ci

      # The webspace: /var/www of the container, the archive unpacked into its document root html/. Apache's user may
      # always write the document root; next to it only with data=outside, so that inside puts the data below it.
      - name: Apache with the archive
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/webspace"
          mkdir -p "$root/html"
          cp -r server/build/shared/. "$root/html/"
          chmod 777 "$root/html"
          if [ "${{ matrix.data }}" = outside ]; then chmod 777 "$root"; else chmod 755 "$root"; fi
          docker run -d --name webspace -p 127.0.0.1:8080:80 -v "$root:/var/www" php:8.4-apache \
            bash -c "a2enmod rewrite >/dev/null && sed -ri 's#AllowOverride None#AllowOverride All#' /etc/apache2/apache2.conf && exec apache2-foreground"
          for _ in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/setup.php && break; sleep 1; done
          echo "LINKROT_E2E_SHARED_ROOT=$root" >> "$GITHUB_ENV"

      - name: End to end through setup.php
        run: go test ./e2e/ -count=1 -run 'TestEndToEndShared$' -v
        working-directory: cli
        env:
          LINKROT_E2E_SHARED_URL: http://127.0.0.1:8080
          LINKROT_E2E_SHARED_CODE: docker exec webspace cat /var/www/html/setup-code.php

      - name: Log of Apache
        if: always()
        run: docker logs webspace 2>&1 | tail -100

  container:
    name: Container image (build, compose file, end-to-end against the image)
    runs-on: ubuntu-latest
    env:
      LINKROT_E2E_REQUIRED: "1"
      LINKROT_E2E_IMAGE: linkrot-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: compose.yaml is valid
        run: docker compose -f compose.yaml config --quiet

      - run: docker build -t "$LINKROT_E2E_IMAGE" .

      - name: Every TLS mode starts with a valid nginx configuration
        run: |
          set -euo pipefail
          for mode in off file acme; do
            d="$(mktemp -d)"
            mkdir "$d/data" "$d/certs"
            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=test -days 1 \
              -keyout "$d/certs/privkey.pem" -out "$d/certs/fullchain.pem" 2>/dev/null
            chmod 644 "$d/certs/privkey.pem"
            id="$(docker run -d --user "$(id -u):$(id -g)" -v "$d/data:/srv/linkrot/app_data" -v "$d/certs:/certs:ro" \
              -e LINKROT_TLS="$mode" -e LINKROT_ACME_EMAIL=ci@example.com "$LINKROT_E2E_IMAGE")"
            ok=0
            for _ in $(seq 60); do
              if docker exec "$id" wget -q -O /dev/null http://127.0.0.1:8080/_ping; then ok=1; break; fi
              sleep 1
            done
            docker logs "$id"
            docker rm -f "$id" >/dev/null
            [ "$ok" = 1 ] || { echo "LINKROT_TLS=$mode does not come up"; exit 1; }
          done

      - name: End to end against the image
        run: go test ./e2e/ -count=1 -run TestEndToEndContainer -v
        working-directory: cli

  # Every push to main is published as ghcr.io/<owner>/linkrot:edge, once all checks passed.
  edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, cli, e2e, shared, container]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      version: edge
