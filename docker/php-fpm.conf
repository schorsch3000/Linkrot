; Linkrot in the container image (linkrot-start runs php-fpm -y with this file, Alpine's own is not used): one pool,
; workers only while there are requests.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[linkrot]
listen = /tmp/linkrot/php-fpm.sock
listen.mode = 0600

; started on demand and stopped again after 10 idle seconds: an idle container has only the master
pm = ondemand
pm.max_children = ${LINKROT_PHP_WORKERS}
pm.process_idle_timeout = 10s
pm.max_requests = 500

; a chunk request writes, reads back and fsyncs one chunk (docs/DEPLOYMENT.md, Timeouts)
request_terminate_timeout = 300s

catch_workers_output = yes
decorate_workers_output = no

; the php-fpm status ping behind /_ping of nginx (the healthcheck)
ping.path = /_ping
