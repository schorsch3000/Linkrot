; Linkrot in the container image. Small shared memory, nothing that is not needed.
expose_php = Off
memory_limit = 128M
max_execution_time = 300
display_errors = Off
log_errors = On

; tokens by mail: msmtp, configured by linkrot-start from the LINKROT_SMTP_* variables
sendmail_path = "/usr/bin/msmtp -C /tmp/linkrot/msmtprc -t -i"

; the code never changes inside the image, config.php of the hosts does: keep checking the timestamps
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 32
opcache.interned_strings_buffer = 4
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; failed-login counters and rate limits of all hosts
apc.enabled = 1
apc.enable_cli = 1
apc.shm_size = 16M
